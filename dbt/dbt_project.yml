name: retail_lakehouse
version: "1.0.0"
config-version: 2
profile: retail_lakehouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

vars:
  reporting_currency: EUR
  online_store_key: 0
  financial_refund_statuses: ["approved", "completed"]

models:
  retail_lakehouse:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: gold
      +materialized: table

tests:
  retail_lakehouse:
    +severity: error
