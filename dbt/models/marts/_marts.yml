version: 2

models:
  - name: dim_date
    description: One row per calendar date, covering whole years of sales and returns activity.
    columns:
      - name: date_key
        description: yyyymmdd integer key.
        tests: [unique, not_null]
      - name: calendar_date
        tests: [unique, not_null]

  - name: dim_customer
    description: One row per customer (Type 1, ADR 004).
    columns:
      - name: customer_key
        tests: [unique, not_null]

  - name: dim_product
    description: One row per product (Type 1, ADR 004).
    columns:
      - name: product_key
        tests: [unique, not_null]

  - name: dim_store_channel
    description: One row per physical store, plus the online store (store_key 0) as the digital channel.
    columns:
      - name: store_key
        tests: [unique, not_null]
      - name: channel
        tests:
          - not_null
          - accepted_values:
              values: ["Online", "Physical store"]

  - name: fct_sales
    description: One row per completed sales order line, in order currency and EUR.
    columns:
      - name: sales_line_key
        description: order_number-line_item business key.
        tests: [unique, not_null]
      - name: order_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: delivery_date_key
        description: Null for in-store sales (ADR 003).
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: store_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_store_channel')
              field: store_key
      - name: quantity
        tests: [not_null]
      - name: gross_sales_eur
        tests: [not_null]

  - name: fct_returns
    description: One row per return event per original order line.
    columns:
      - name: return_id
        tests: [unique, not_null]
      - name: sales_line_key
        tests:
          - not_null
          - relationships:
              to: ref('fct_sales')
              field: sales_line_key
      - name: return_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: refund_date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: return_store_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_store_channel')
              field: store_key
      - name: refund_status
        tests:
          - not_null
          - accepted_values:
              values: ["requested", "approved", "completed", "rejected", "cancelled"]
      - name: return_reason
        tests:
          - not_null
          - accepted_values:
              values: ["defective", "changed_mind", "not_as_described", "wrong_item", "damaged_in_transit", "late_delivery"]
      - name: item_condition
        tests:
          - not_null
          - accepted_values:
              values: ["new_unopened", "opened", "damaged", "defective"]
      - name: return_channel
        tests:
          - not_null
          - accepted_values:
              values: ["store", "online"]
